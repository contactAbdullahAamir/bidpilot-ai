services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bidpilot
      POSTGRES_USER: bidpilot
      POSTGRES_PASSWORD: bidpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidpilot"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://bidpilot:bidpilot@postgres:5432/bidpilot
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-in-production}
      STORAGE_DIR: /data/storage
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  ai-orchestrator:
    build:
      context: .
      dockerfile: apps/ai-orchestrator/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:3001/api/v1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Optional infrastructure for upcoming phases (BullMQ queues, S3 storage).
  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    ports:
      - "6379:6379"
  minio:
    image: quay.io/minio/minio:latest
    profiles: ["infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bidpilot
      MINIO_ROOT_PASSWORD: bidpilot-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  storage_data:
  minio_data:
